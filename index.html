<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#102d17">

    <title>The Twelve Amazonian Guardians of the Forties</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- Dark atmospheric overlay -->
    <div class="background-overlay"></div>


    <main class="calendar">

        <!-- =========================
             TITLE
        ========================== -->

        <header class="title-card">

            <h1>
                The Twelve Amazonian<br>
                Guardians of the Forties
            </h1>

        </header>


        <!-- =========================
             DOORS
        ========================== -->

        <section class="doors" aria-label="The Twelve Amazonian Guardians">


            <button class="door door-1"
                    data-bird="1"
                    aria-label="Open guardian 1">
                <span>1</span>
            </button>


            <button class="door door-2"
                    data-bird="2"
                    aria-label="Open guardian 2">
                <span>2</span>
            </button>


            <button class="door door-3"
                    data-bird="3"
                    aria-label="Open guardian 3">
                <span>3</span>
            </button>


            <button class="door door-4"
                    data-bird="4"
                    aria-label="Open guardian 4">
                <span>4</span>
            </button>


            <button class="door door-5"
                    data-bird="5"
                    aria-label="Open guardian 5">
                <span>5</span>
            </button>


            <button class="door door-6"
                    data-bird="6"
                    aria-label="Open guardian 6">
                <span>6</span>
            </button>


            <button class="door door-7"
                    data-bird="7"
                    aria-label="Open guardian 7">
                <span>7</span>
            </button>


            <button class="door door-8"
                    data-bird="8"
                    aria-label="Open guardian 8">
                <span>8</span>
            </button>


            <button class="door door-9"
                    data-bird="9"
                    aria-label="Open guardian 9">
                <span>9</span>
            </button>


            <button class="door door-10"
                    data-bird="10"
                    aria-label="Open guardian 10">
                <span>10</span>
            </button>


            <button class="door door-11"
                    data-bird="11"
                    aria-label="Open guardian 11">
                <span>11</span>
            </button>


            <button class="door door-12"
                    data-bird="12"
                    aria-label="Open guardian 12">
                <span>12</span>
            </button>


        </section>

    </main>


    <!-- =========================
         BIRD MODAL
    ========================== -->

    <div id="birdModal"
         class="modal"
         aria-hidden="true">

        <div class="modal-backdrop"></div>


        <div class="modal-window">

            <button id="closeModal"
                    class="close-button"
                    aria-label="Close">
                ×
            </button>


            <img id="birdImage"
                 src=""
                 alt="Amazonian guardian">

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
